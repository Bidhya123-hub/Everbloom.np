<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flower Bouquet Shop</title>

<style>

body{
font-family: Arial;
margin:0;
background:#fff5f7;
}

header{
background:#e91e63;
color:white;
padding:20px;
text-align:center;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:30px;
}

.card{
background:white;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
text-align:center;
padding:15px;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

.card h3{
margin:10px 0;
}

button{
background:#e91e63;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#c2185b;
}

.cart{
background:white;
padding:20px;
margin:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.order{
background:white;
padding:20px;
margin:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
max-width:400px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
}

</style>
</head>

<body>

<header>
<h1>🌸 Online Flower Bouquet Shop</h1>
<p>Order Beautiful Bouquets for Your Loved Ones</p>
</header>

<section class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946">
<h3>Rose Bouquet</h3>
<p>$20</p>
<button onclick="addCart('Rose Bouquet',20)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6">
<h3>Lily Bouquet</h3>
<p>$25</p>
<button onclick="addCart('Lily Bouquet',25)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93">
<h3>Sunflower Bouquet</h3>
<p>$18</p>
<button onclick="addCart('Sunflower Bouquet',18)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1502082553048-f009c37129b9">
<h3>Lotus Bouquet</h3>
<p>$22</p>
<button onclick="addCart('Lotus Bouquet',22)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1468327768560-75b778cbb551">
<h3>Tulips Bouquet</h3>
<p>$24</p>
<button onclick="addCart('Tulips Bouquet',24)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1496060169243-453fde45943b">
<h3>Orchid Bouquet</h3>
<p>$28</p>
<button onclick="addCart('Orchid Bouquet',28)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1504198266285-165a1f9f36ff">
<h3>Daisy Bouquet</h3>
<p>$16</p>
<button onclick="addCart('Daisy Bouquet',16)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1493244040629-496f6d136cc3">
<h3>Lavender Bouquet</h3>
<p>$19</p>
<button onclick="addCart('Lavender Bouquet',19)">Add to Cart</button>
</div>

</section>

<section class="cart">
<h2>🛒 Shopping Cart</h2>
<ul id="cartList"></ul>
<h3>Total: $<span id="total">0</span></h3>
</section>

<section class="order">
<h2>📦 Place Order</h2>

<input type="text" id="name" placeholder="Your Name">
<input type="text" id="address" placeholder="Delivery Address">
<input type="text" id="phone" placeholder="Phone Number">

<button onclick="placeOrder()">Submit Order</button>

<p id="message"></p>

</section>

<script>

let cart=[]
let total=0

function addCart(name,price){

cart.push(name)
total+=price

let list=document.getElementById("cartList")
let item=document.createElement("li")
item.innerText=name+" - $"+price
list.appendChild(item)

document.getElementById("total").innerText=total
}

function placeOrder(){

let name=document.getElementById("name").value
let address=document.getElementById("address").value
let phone=document.getElementById("phone").value

if(name==""||address==""||phone==""){
document.getElementById("message").innerText="Please fill all details"
return
}

document.getElementById("message").innerText=
"✅ Thank you "+name+"! Your flowers will be delivered soon 🌸"
}

</script>

</body>
</html>
